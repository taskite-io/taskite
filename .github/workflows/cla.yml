name: CLA

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-cla:
    name: Verify CLA trailers
    runs-on: ubuntu-latest
    steps:
      - name: Check every commit
        uses: actions/github-script@v7
        with:
          script: |
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100
              }
            );

            const missing = commits
              .filter(({ commit }) => {
                const message = commit.message;
                const signedOff = /^Signed-off-by: .+ <[^>]+>$/mi.test(message);
                const acceptedCla = /^Taskite-CLA: 1\.0$/mi.test(message);
                return !signedOff || !acceptedCla;
              })
              .map(({ sha }) => sha.substring(0, 12));

            if (missing.length > 0) {
              core.setFailed(
                `Missing Signed-off-by or Taskite-CLA: 1.0 trailer: ${missing.join(", ")}`
              );
            }
